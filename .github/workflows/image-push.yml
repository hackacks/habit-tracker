name: Image push to ECR
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG: ${{ github.sha }}
  AWS_REGION: ${{ secrets.AWS_REGION }}

  VITE_HABIT_FLOW_COGNITO_REGION: ${{ vars.VITE_HABIT_FLOW_COGNITO_REGION }}
  VITE_HABIT_FLOW_COGNITO_USER_POOL_ID: ${{ vars.VITE_HABIT_FLOW_COGNITO_USER_POOL_ID }}
  VITE_HABIT_FLOW_COGNITO_APP_CLIENT_ID: ${{ vars.VITE_HABIT_FLOW_COGNITO_APP_CLIENT_ID }}
jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build And Tag
        run: |
          docker build \
          --build-arg VITE_HABIT_FLOW_COGNITO_REGION="${{ env.VITE_HABIT_FLOW_COGNITO_REGION }}" \
          --build-arg VITE_HABIT_FLOW_COGNITO_USER_POOL_ID="${{ env.VITE_HABIT_FLOW_COGNITO_USER_POOL_ID }}" \
          --build-arg VITE_HABIT_FLOW_COGNITO_APP_CLIENT_ID="${{ env.VITE_HABIT_FLOW_COGNITO_APP_CLIENT_ID }}" \
          -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" \
          -f Dockerfile \
          .
      - name: Push to Amazon ECR
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}"
